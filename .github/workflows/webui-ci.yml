name: WebUI CI/CD

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'WebUI/**'
      - '.github/workflows/webui-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'WebUI/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore WebUI/WebUI.API/WebUI.API.csproj
    
    - name: Build
      run: dotnet build WebUI/WebUI.API/WebUI.API.csproj --configuration Release --no-restore
    
    - name: Test
      run: dotnet test WebUI/WebUI.Tests/WebUI.Tests.csproj --configuration Release --no-build --verbosity normal
    
    - name: Publish
      run: dotnet publish WebUI/WebUI.API/WebUI.API.csproj --configuration Release --output ./publish
    
    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: ./publish

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: WebUI/WebUI.Frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: WebUI/WebUI.Frontend
      run: npm ci
    
    - name: Lint
      working-directory: WebUI/WebUI.Frontend
      run: npm run lint
    
    - name: Build
      working-directory: WebUI/WebUI.Frontend
      run: npm run build
    
    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: WebUI/WebUI.Frontend/dist

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: WebUI/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lean-webui:latest
          ${{ secrets.DOCKER_USERNAME }}/lean-webui:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
